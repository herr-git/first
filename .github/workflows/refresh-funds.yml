# Fetches fund data from Yahoo Finance and saves it into data/funds-latest.json.
# Timer: every 15 minutes at :07, :22, :37, :52, from 13:00 to 21:59 UTC on weekdays.
# That covers US market hours (9:30 to 16:00 New York time) in both summer and
# winter, plus one run after the close. The script itself decides "open" or "closed".
# Timed runs only happen from the main branch.
name: Refresh fund data

on:
  schedule:
    - cron: "7,22,37,52 13-21 * * 1-5"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/fetch_funds.py"
      - ".github/workflows/refresh-funds.yml"

permissions:
  contents: write

concurrency:
  group: refresh-funds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Start from the newest version of the branch, not the commit that triggered the run,
      # so a run that waited in line does not start from an older copy of the data.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet yfinance

      - name: Fetch from Yahoo
        run: python scripts/fetch_funds.py

      - name: Save the new data
        run: |
          git config user.name "crypto-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/funds-latest.json
          [ -f data/funds-fetch-log.txt ] && git add data/funds-fetch-log.txt
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Refresh fund data"
          for i in 1 2 3; do
            git pull --rebase -X theirs -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "Could not save the data after 3 tries."
          exit 1
