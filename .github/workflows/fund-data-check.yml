# V1-1: one-off check of what free sources return for the 6 funds.
# Runs when this check's files change, or by hand from the Actions tab.
# Saves the result to reports/fund-data-raw.md. Changes nothing on the site.
name: Fund data check

on:
  workflow_dispatch: {}
  push:
    paths:
      - "scripts/fund_data_check.py"
      - ".github/workflows/fund-data-check.yml"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet yfinance
      - run: python scripts/fund_data_check.py
      - name: Save the report
        run: |
          git config user.name "crypto-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/fund-data-raw.md
          git diff --cached --quiet && exit 0
          git commit -m "Fund data check: raw output"
          for i in 1 2 3; do
            git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
