# Once a day: saves about 6 months of daily prices into data/history.json
# for the pretend-portfolio page. Runs at 06:17 UTC, after the US market has
# closed and CoinGecko has published the previous day's price.
name: Refresh price history

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/fetch_history.py"
      - ".github/workflows/refresh-history.yml"

permissions:
  contents: write

concurrency:
  group: refresh-history
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Start from the newest version of the branch, not the commit that triggered the run,
      # so a run that waited in line does not start from an older copy of the data.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet yfinance

      - name: Fetch 6 months of daily prices
        env:
          COINGECKO_DEMO_KEY: ${{ secrets.COINGECKO_DEMO_KEY }}
        run: python scripts/fetch_history.py

      - name: Save the new data
        run: |
          git config user.name "crypto-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/history-log.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Refresh price history"
          for i in 1 2 3; do
            git pull --rebase -X theirs -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "Could not save the data after 3 tries."
          exit 1
